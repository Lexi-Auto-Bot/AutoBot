name: Keep Render JoinBot awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping JoinBot health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 10 --retry-all-errors \
            --max-time 90 \
            "https://autobot-u9b8.onrender.com/health"
